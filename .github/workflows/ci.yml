name: MAUverce CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend:
    name: Backend tests and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mauverse-api
    steps:
      - name: Check out sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            mauverse-api/requirements.txt
            mauverse-api/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run Ruff
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q apps tests main.py

  api-image:
    name: API container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build image
        run: docker build --pull --tag mauverce-api:ci mauverse-api

      - name: Verify non-root runtime and health
        shell: bash
        run: |
          docker run --rm --entrypoint python mauverce-api:ci \
            -c "import os; raise SystemExit(0 if os.geteuid() != 0 else 1)"

          container_id="$(docker run --detach \
            --env SCHEDULE_DB_USER=test \
            --env SCHEDULE_DB_PASSWORD=test \
            --env DEBT_DB_USER=test \
            --env DEBT_DB_PASSWORD=test \
            mauverce-api:ci)"

          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            running="$(docker inspect --format '{{.State.Running}}' "$container_id")"
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [[ "$health" == "healthy" ]]; then
              exit 0
            fi
            if [[ "$running" != "true" || "$health" == "unhealthy" ]]; then
              exit 1
            fi
            sleep 2
          done

          echo "Container did not become healthy within 60 seconds" >&2
          exit 1

  android-release:
    name: Android Release configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    defaults:
      run:
        working-directory: mauverse_mobile
    steps:
      - name: Check out sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: mauverse_mobile/global.json

      - name: Set up JDK
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore NuGet cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('mauverse_mobile/global.json', 'mauverse_mobile/mau.csproj', 'mauverse_mobile.Tests/mauverse_mobile.Tests.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Restore projects
        run: dotnet restore mau.sln

      - name: Run mobile unit tests
        run: dotnet test ../mauverse_mobile.Tests/mauverse_mobile.Tests.csproj --configuration Release --no-restore --warnaserror

      - name: Build Release configuration
        run: >-
          dotnet build mau.csproj
          --configuration Release
          --framework net10.0-android
          --no-restore
          --warnaserror
          -p:ContinuousIntegrationBuild=true
          -maxcpucount:1

      - name: Create unsigned artifact checksums
        shell: bash
        run: |
          mapfile -t artifacts < <(find bin/Release/net10.0-android -maxdepth 1 \
            -type f \( -name '*.aab' -o \( -name '*.apk' ! -name '*-Signed.apk' \) \) \
            -print | sort)
          test "${#artifacts[@]}" -ge 2
          sha256sum "${artifacts[@]}" > bin/Release/net10.0-android/checksums.txt

      - name: Upload unsigned CI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mauverce-android-release-unsigned
          path: |
            mauverse_mobile/bin/Release/net10.0-android/*.apk
            !mauverse_mobile/bin/Release/net10.0-android/*-Signed.apk
            mauverse_mobile/bin/Release/net10.0-android/*.aab
            mauverse_mobile/bin/Release/net10.0-android/checksums.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  ios-release-unsigned:
    name: iPhone Release configuration (unsigned)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    defaults:
      run:
        working-directory: mauverse_mobile
    steps:
      - name: Check out sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: mauverse_mobile/global.json

      - name: Report Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          dotnet --info

      - name: Restore NuGet cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-ios-nuget-${{ hashFiles('mauverse_mobile/global.json', 'mauverse_mobile/mau.csproj') }}
          restore-keys: |
            ${{ runner.os }}-ios-nuget-
            ${{ runner.os }}-nuget-

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --skip-manifest-update

      - name: Restore iPhone target
        run: >-
          dotnet restore mau.csproj
          -p:TargetFramework=net10.0-ios
          -p:RuntimeIdentifier=ios-arm64

      - name: Publish unsigned iPhone application
        run: >-
          dotnet publish mau.csproj
          --configuration Release
          --framework net10.0-ios
          --runtime ios-arm64
          --no-restore
          --warnaserror
          -p:ArchiveOnBuild=false
          -p:BuildIpa=false
          -p:CodesignRequireProvisioningProfile=false
          -p:ContinuousIntegrationBuild=true
          -p:CreatePackage=false
          -p:EnableCodeSigning=false
          -p:EnableDefaultCodesignEntitlements=false
          -maxcpucount:1

      - name: Verify and package unsigned application
        shell: bash
        run: |
          set -euo pipefail

          publish_dir="bin/Release/net10.0-ios/ios-arm64/publish"
          app_path="$(find "$publish_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"

          if codesign --verify "$app_path" >/dev/null 2>&1; then
            echo "Refusing to upload a signed iOS application." >&2
            exit 1
          fi

          signing_material="$(find "$app_path" \
            \( -type d -name '_CodeSignature' -o -type f -name 'embedded.mobileprovision' \) \
            -print -quit)"
          if [[ -n "$signing_material" ]]; then
            echo "Signing material was found: $signing_material" >&2
            exit 1
          fi

          artifact_dir="bin/Release/net10.0-ios/unsigned-artifact"
          payload_dir="$artifact_dir/Payload"
          mkdir -p "$payload_dir"
          ditto "$app_path" "$payload_dir/$(basename "$app_path")"

          (
            cd "$artifact_dir"
            /usr/bin/zip -qry "../mauverce-ios-arm64-unsigned.ipa" Payload
          )

          {
            echo "commit=${GITHUB_SHA}"
            echo "target=net10.0-ios"
            echo "runtime=ios-arm64"
            echo "signed=false"
            echo "provisioning_profile=false"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "iphoneos_sdk=$(xcrun --sdk iphoneos --show-sdk-version)"
          } > "bin/Release/net10.0-ios/build-metadata.txt"

          (
            cd bin/Release/net10.0-ios
            shasum -a 256 mauverce-ios-arm64-unsigned.ipa > checksums.txt
          )

      - name: Upload unsigned iPhone artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mauverce-ios-arm64-release-unsigned
          path: |
            mauverse_mobile/bin/Release/net10.0-ios/mauverce-ios-arm64-unsigned.ipa
            mauverse_mobile/bin/Release/net10.0-ios/checksums.txt
            mauverse_mobile/bin/Release/net10.0-ios/build-metadata.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
