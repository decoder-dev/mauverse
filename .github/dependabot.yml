version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /mauverse-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /mauverse-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: nuget
    directory: /mauverse_mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
